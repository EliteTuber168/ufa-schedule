# Deploy config for the UFA bot Worker. GitHub deploys it automatically (.github/workflows/deploy-worker.yml).
# Variables and secrets stay in the Cloudflare dashboard (keep_vars keeps them).
name = "ufa-draft"
main = "worker.js"
compatibility_date = "2026-09-01"
workers_dev = true
keep_vars = true

[[kv_namespaces]]
binding = "VOTES"
id = "c9b7d8c749364764805b70b652d95956"

[observability]
enabled = true

# every minute: auto-pick when the draft clock runs out; the Worker also runs the fun counters (every 2 min)
# and the live franchise owner list (every 5 min) from this same trigger
[triggers]
crons = ["* * * * *"]

# always-on Discord gateway connection (bot status + DMs → tickets)
[[durable_objects.bindings]]
name = "GATEWAY"
class_name = "Gateway"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Gateway"]

# lets the bot know which deploy it's running (each deploy gets a fresh gateway connection)
[version_metadata]
binding = "CF_VERSION"
