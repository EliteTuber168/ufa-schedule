name: Post draft picks to Discord
on:
  push:
    branches: [main]
    paths: [draft.json]
concurrency:
  group: post-picks
  cancel-in-progress: false
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Post picks, give team roles, DM players
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
          DRAFT_CHANNEL_ID: ${{ secrets.DRAFT_CHANNEL_ID }}
          DRAFT_ROLE: ${{ secrets.DRAFT_ROLE }}
        run: python scripts/post_picks.py
