name: Sync draft players from Discord
on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"
permissions:
  contents: write
concurrency:
  group: draft-json
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync pool
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
          DRAFT_ROLE: ${{ secrets.DRAFT_ROLE }}
        run: python scripts/sync_players.py
      - name: Commit changes
        run: |
          git config user.name "ufa-draft-bot"
          git config user.email "ufa-draft-bot@users.noreply.github.com"
          git add draft.json
          git diff --cached --quiet && echo "No changes" || (git commit -m "Sync draft pool from Discord" && git push)
